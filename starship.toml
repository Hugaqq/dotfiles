"$schema" = 'https://starship.rs/config-schema.json'

# 极简单行提示符：  ~/dotfiles main ! ❯
# - 只用终端自带的 16 色，终端换主题 / 切明暗模式它都跟着变
# - 不用任何 Nerd Font 图标，任何机器、任何字体都能正常显示
# - 不调用 python / node / cc 等外部命令，只有 git

add_newline = true          # 两条命令之间空一行；嫌占地方改成 false
command_timeout = 1000

format = "$username$hostname$directory$git_branch$git_state$git_status$conda$python$cmd_duration$character"

# 用户名 / 主机名：只在 SSH 或 root 时出现
[username]
format = '[$user]($style)@'
style_user = 'yellow'
style_root = 'bold red'

[hostname]
format = '[$hostname]($style) '
style = 'yellow'

[directory]
style = 'blue'
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = '[$branch]($style) '
style = 'purple'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'yellow'
conflicted = '='
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
untracked = '?'
stashed = '$'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'
ignore_submodules = true

# 只在激活了环境时显示环境名
[conda]
format = '[$environment]($style) '
style = 'green'
ignore_base = true

[python]
format = '[(\($virtualenv\) )]($style)'
style = 'green'
detect_extensions = []
detect_files = []
detect_folders = []

[cmd_duration]
min_time = 3000
format = '[$duration]($style) '
style = 'bright-black'

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](green)'
