# ~/dotfiles/tmux/tmux.conf — 由 ~/.tmux.conf 软链接过来
# 修改后执行: tmux source-file ~/.tmux.conf

# ---------------- 终端能力 ----------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g allow-passthrough on          # 让 starship / bat 的渐变与真彩色穿透
set -g focus-events on               # 切 pane 后 vim/nvim 正确刷新
set -g set-clipboard on
set -sg escape-time 10

# ---------------- 基础行为 ----------------
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on                      # 滚轮、点选 pane、拖动分屏
setw -g mode-keys vi

# ---------------- 前缀键：C-a（C-b 仍可用） ----------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind C-b send-prefix

# ---------------- 窗口与窗格 ----------------
bind c new-window -c "#{pane_current_path}"      # 新窗口沿用当前目录
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 按住 Shift 后连续调整窗格大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 重载配置
bind r source-file ~/.tmux.conf \; display-message "tmux 配置已重载"
set -g pane-border-indicators both

# ---------------- 复制模式（vi） ----------------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ---------------- 外观（贴近 Catppuccin Mocha） ----------------
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] "
set -g status-left-length 30
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g status-interval 5
set -g status-right "#[fg=#6c7086]%Y-%m-%d #[fg=#cdd6f4]%H:%M "
set -g clock-mode-colour "#89b4fa"

# 复制内容直接进 macOS 剪贴板
set -s copy-command 'pbcopy'
