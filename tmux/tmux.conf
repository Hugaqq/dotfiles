# tmux.conf — 修改后执行: tmux source-file ~/.tmux.conf
# 带 q 的 set（-gq / -sq）：旧版 tmux 不认识该选项时静默跳过，不报错。

# ---------------- 终端能力 ----------------
set -g default-terminal "tmux-256color"
set -asq terminal-features ",*256col*:RGB"
set -gq allow-passthrough on
set -g focus-events on
set -g set-clipboard on              # 经 OSC 52 写系统剪贴板，SSH 里也能用
set -sg escape-time 10

# ---------------- 基础行为 ----------------
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi

# ---------------- 前缀键：C-a（C-b 仍可用） ----------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind C-b send-prefix

# ---------------- 窗口与窗格 ----------------
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.tmux.conf \; display-message "tmux 配置已重载"

# ---------------- 复制模式（vi） ----------------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
if-shell 'command -v pbcopy' "set -sq copy-command 'pbcopy'"

# ---------------- 外观：只用终端自带颜色，跟随终端主题 ----------------
set -g status-style "bg=default,fg=default"
set -g status-left "#[bold]#S  "
set -g status-left-length 30
set -g window-status-format "#[fg=brightblack]#I:#W "
set -g window-status-current-format "#[fg=blue,bold]#I:#W "
set -g status-right "#[fg=brightblack]%m-%d %H:%M"
set -g status-interval 15
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=yellow"
